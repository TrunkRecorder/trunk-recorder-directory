# trunkrecorder.pro/directory: one Worker for the directory's API
# (/directory/api/v1/…) and its website (the Vite build, under /directory/).
#
# It is routed on the path only: the landing page (trunkrecorder.pro) stays its
# own static Worker (TrunkRecorder/trunk-recorder-pro-site). A second route takes
# /api/v1/fcc/*: the FCC license lookup Trunk Recorder Pro asks (src/fcc/), over
# ArgusRF's FCC database. Routes win over the site's custom domain for their paths.

name = "trunk-recorder-directory"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "trunkrecorder.pro/directory*", zone_name = "trunkrecorder.pro" },
  { pattern = "trunkrecorder.pro/api/v1/fcc/*", zone_name = "trunkrecorder.pro" },
]

# The website. Files are under dist/directory/ so their paths are the URL's;
# the Worker runs first and falls back to the app's index.html for its routes.
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

# The records and their history. Create it with `wrangler d1 create directory`
# and paste its id here; `npm run db:migrate` applies migrations/.
[[d1_databases]]
binding = "DB"
database_name = "directory"
database_id = "d7aca0e0-faed-4cf3-b525-fafacc20bfb7"
migrations_dir = "migrations"

# Every share, as it came (the audit trail): `wrangler r2 bucket create trp-directory-observations`.
[[r2_buckets]]
binding = "OBSERVATIONS"
bucket_name = "trp-directory-observations"

# Shares, per recorder ID and per IP.
[[ratelimits]]
name = "SHARE_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

# ArgusRF's FCC ULS database (robotastic/argusrf builds and uploads it, a new
# database per FCC refresh: argus-YYYYMMDD), read only: /api/v1/fcc/*, and
# placing sites (src/place.ts). Its schema is copied in src/fcc/schema.sql.
[[d1_databases]]
binding = "FCC_DB"
database_name = "argus-20261018"
database_id = "40d6b71a-211a-42a2-a04f-8265f00b8018"

# The map's basemap (tiles/us.pmtiles): read only here; scripts/maps.ts uploads it.
# Staging reads the same one.
[[r2_buckets]]
binding = "MAPS"
bucket_name = "trp-directory-maps"

# FCC lookups, per IP.
[[ratelimits]]
name = "FCC_LIMIT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 30
  period = 60

# ADMIN_TOKEN (a secret: `wrangler secret put ADMIN_TOKEN`) authorises the
# steward/admin endpoints until there are accounts.

# ── staging: its own Worker on workers.dev, its own D1 and R2, for testing
# writes end to end (npm run test:staging). Bindings aren't inherited.
[env.staging]
name = "trunk-recorder-directory-staging"
workers_dev = true
routes = []

[env.staging.assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "directory-staging"
database_id = "fb605799-2982-40b4-b340-b3353be67459"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "OBSERVATIONS"
bucket_name = "trp-directory-observations-staging"

[[env.staging.ratelimits]]
name = "SHARE_LIMIT"
namespace_id = "1003"
  [env.staging.ratelimits.simple]
  limit = 200
  period = 60

# The same FCC database, read only (staging tests read real licenses).
[[env.staging.d1_databases]]
binding = "FCC_DB"
database_name = "argus-20261018"
database_id = "40d6b71a-211a-42a2-a04f-8265f00b8018"

[[env.staging.r2_buckets]]
binding = "MAPS"
bucket_name = "trp-directory-maps"

[[env.staging.ratelimits]]
name = "FCC_LIMIT"
namespace_id = "1005"
  [env.staging.ratelimits.simple]
  limit = 200
  period = 60
